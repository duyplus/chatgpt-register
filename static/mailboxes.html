<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title data-i18n="mb.title">邮箱管理 · ChatGPT 注册管理</title>
  <link rel="stylesheet" href="/static/style.css?v=8">
</head>

<body data-page="mailboxes">
  <div class="layout">
    <main class="main">
      <h1 class="page-title" data-i18n="mb.title">邮箱管理</h1>
      <div class="toolbar">
        <input id="mb-search" class="px-input search" placeholder="搜索 email / 备注 ..."
          data-i18n-ph="mb.search_placeholder">
        <select id="mb-filter" class="px-input">
          <option value="" data-i18n="mb.all_status">全部状态</option>
          <option value="unverified" data-i18n="mb.status_unverified">待验证</option>
          <option value="verifying" data-i18n="mb.status_verifying">验证中</option>
          <option value="verify_failed" data-i18n="mb.status_verify_failed">验证失败</option>
          <option value="verified" data-i18n="mb.status_verified">已验证</option>
        </select>
        <button class="px-btn primary" onclick="openImportModal()" data-i18n="mb.batch_import">批量导入邮箱</button>
      </div>
      <div class="batch-bar" id="mb-batch" style="display:none">
        <span id="mb-batch-count">已选 0 项</span>
        <button class="px-btn danger" onclick="delSelected()" data-i18n="mb.batch_delete">删除所选</button>
        <button class="px-btn ghost" onclick="clearSelection()" data-i18n="common.cancel">取消</button>
      </div>
      <div class="table-wrap">
        <table class="px-table">
          <thead>
            <tr>
              <th class="col-check"><input type="checkbox" id="mb-check-all" onclick="toggleSelectAll(this.checked)">
              </th>
              <th data-i18n="mb.col_email">邮箱</th>
              <th data-i18n="mb.col_reg_count">注册数量</th>
              <th data-i18n="acc.col_created_at">创建时间</th>
              <th data-i18n="mb.col_status">状态</th>
              <th data-i18n="mb.col_actions">操作</th>
            </tr>
          </thead>
          <tbody id="mb-rows"></tbody>
        </table>
        <div class="pager" id="mb-pager"></div>
      </div>
    </main>
  </div>

  <!-- 邮箱编辑 modal -->
  <div class="modal-mask" id="mb-modal" style="display:none">
    <div class="modal px-panel">
      <h2 id="mb-modal-title" data-i18n="mb.modal_add_title">新增邮箱</h2>
      <input type="hidden" id="mb-id">
      <label>Email *</label><input id="mb-email" class="px-input">
      <label data-i18n="mb.password">密码</label><input id="mb-password" class="px-input">
      <label data-i18n="mb.provider">服务商</label><input id="mb-provider" class="px-input"
        placeholder="outlook / gmail ..." data-i18n-ph="mb.provider_ph">
      <label data-i18n="mb.client_id">Client ID（Outlook 取件用）</label><input id="mb-client-id" class="px-input">
      <label data-i18n="mb.refresh_token">Refresh Token（Outlook 取件用）</label><textarea id="mb-refresh-token"
        class="px-input" rows="2"></textarea>
      <label data-i18n="mb.col_status">状态</label>
      <select id="mb-status" class="px-input">
        <option value="unverified" data-i18n="mb.status_unverified">待验证</option>
        <option value="verifying" data-i18n="mb.status_verifying">验证中</option>
        <option value="verify_failed" data-i18n="mb.status_verify_failed">验证失败</option>
        <option value="verified" data-i18n="mb.status_verified">已验证</option>
      </select>
      <label data-i18n="mb.note">备注</label><textarea id="mb-note" class="px-input" rows="3"></textarea>
      <div class="modal-actions">
        <button class="px-btn" onclick="closeModal('mb-modal')" data-i18n="common.cancel">取消</button>
        <button class="px-btn primary" onclick="saveMailbox()" data-i18n="mb.save">保存</button>
      </div>
    </div>
  </div>

  <!-- 批量导入 modal -->
  <div class="modal-mask" id="import-modal" style="display:none">
    <div class="modal px-panel" style="width:620px">
      <h2 data-i18n="mb.import_title">批量导入邮箱</h2>
      <div class="import-sub" data-i18n="mb.import_sub">每行一个，重复 email 自动跳过，格式：</div>
      <div class="import-formats">
        <code>someone@outlook.com----密码----client_id----refresh_token</code>
      </div>
      <textarea id="import-text" class="px-input import-textarea" rows="11" placeholder="在此粘贴内容，或直接把 txt 文件拖到这里 ..."
        data-i18n-ph="mb.import_placeholder"></textarea>
      <div class="modal-actions">
        <span id="import-count" class="import-count">已识别 0 个邮箱</span>
        <button class="px-btn" onclick="closeModal('import-modal')" data-i18n="common.cancel">取消</button>
        <button class="px-btn primary" onclick="doImport()" data-i18n="mb.do_import">导入</button>
      </div>
    </div>
  </div>

  <!-- 取件 modal -->
  <div class="modal-mask" id="mail-modal" style="display:none">
    <div class="modal px-panel mail-modal">
      <div class="mail-head">
        <div>
          <h2 id="mail-title" data-i18n="mb.fetch_title">取件</h2>
          <div class="mail-sub" id="mail-sub"></div>
        </div>
        <button class="px-btn" onclick="closeMailModal()" data-i18n="acc.close">关闭</button>
      </div>
      <div class="mail-body">
        <div class="mail-list" id="mail-list">
          <div class="mail-empty" data-i18n="mb.loading">加载中...</div>
        </div>
        <div class="mail-detail">
          <div class="mail-meta" id="mail-meta"></div>
          <iframe id="mail-frame" sandbox="allow-same-origin allow-popups" title="邮件内容"></iframe>
        </div>
      </div>
    </div>
  </div>

  <div id="toast" class="toast" style="display:none"></div>
  <script src="/static/i18n/zh.js"></script>
  <script src="/static/i18n/en.js"></script>
  <script src="/static/i18n/vi.js"></script>
  <script src="/static/i18n/i18n.js"></script>
  <script src="/static/layout.js?v=2"></script>
  <script src="/static/mailboxes.js?v=8"></script>
</body>

</html>
