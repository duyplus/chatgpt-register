<!DOCTYPE html>
<html lang="vi">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title data-i18n="mb.title">Quản lý Hòm thư · ChatGPT Reg Admin</title>
  <link rel="stylesheet" href="/static/style.css?v=8">
</head>

<body data-page="mailboxes">
  <div class="layout">
    <main class="main">
      <h1 class="page-title" data-i18n="mb.title">Quản lý Hòm thư</h1>
      <div class="toolbar">
        <input id="mb-search" class="px-input search" placeholder="Tìm email / ghi chú ..."
          data-i18n-ph="mb.search_placeholder">
        <select id="mb-filter" class="px-input">
          <option value="" data-i18n="mb.all_status">Tất cả trạng thái</option>
          <option value="unverified" data-i18n="mb.status_unverified">Chờ xác minh</option>
          <option value="verifying" data-i18n="mb.status_verifying">Đang xác minh</option>
          <option value="verify_failed" data-i18n="mb.status_verify_failed">Xác minh thất bại</option>
          <option value="verified" data-i18n="mb.status_verified">Đã xác minh</option>
        </select>
        <button class="px-btn primary" onclick="openImportModal()" data-i18n="mb.batch_import">Nhập hòm thư hàng loạt</button>
      </div>
      <div class="batch-bar" id="mb-batch" style="display:none">
        <span id="mb-batch-count">Đã chọn 0 mục</span>
        <button class="px-btn primary" onclick="produceSelectedMailboxes()">Sản xuất mục đã chọn</button>
        <button class="px-btn danger" onclick="delSelected()" data-i18n="mb.batch_delete">Xóa mục đã chọn</button>
        <button class="px-btn ghost" onclick="clearSelection()" data-i18n="common.cancel">Hủy</button>
      </div>
      <div class="table-wrap">
        <table class="px-table">
          <thead>
            <tr>
              <th class="col-check"><input type="checkbox" id="mb-check-all" onclick="toggleSelectAll(this.checked)">
              </th>
              <th data-i18n="mb.col_email">Địa chỉ hòm thư</th>
              <th data-i18n="mb.col_provider">Nhà cung cấp</th>
              <th data-i18n="mb.col_status">Trạng thái</th>
              <th data-i18n="acc.col_created_at">Thời gian tạo</th>
              <th data-i18n="acc.col_updated_at">Thời gian cập nhật</th>
              <th data-i18n="mb.col_actions">Thao tác</th>
            </tr>
          </thead>
          <tbody id="mb-rows"></tbody>
        </table>
        <div class="pager" id="mb-pager"></div>
      </div>
    </main>
  </div>

  <!-- 邮箱编辑 modal -->
  <div class="modal-mask" id="mb-modal" style="display:none">
    <div class="modal px-panel">
      <h2 id="mb-modal-title" data-i18n="mb.modal_add_title">Thêm Hòm thư</h2>
      <input type="hidden" id="mb-id">
      <label>Email *</label><input id="mb-email" class="px-input">
      <label data-i18n="mb.password">Mật khẩu</label><input id="mb-password" class="px-input">
      <label data-i18n="mb.provider">Nhà cung cấp</label><input id="mb-provider" class="px-input"
        placeholder="outlook / gmail ..." data-i18n-ph="mb.provider_ph">
      <label data-i18n="mb.client_id">Client ID (Dành cho Outlook)</label><input id="mb-client-id" class="px-input">
      <label data-i18n="mb.refresh_token">Refresh Token (Dành cho Outlook)</label><textarea id="mb-refresh-token"
        class="px-input" rows="2"></textarea>
      <label data-i18n="mb.col_status">Trạng thái</label>
      <select id="mb-status" class="px-input">
        <option value="unverified" data-i18n="mb.status_unverified">Chờ xác minh</option>
        <option value="verifying" data-i18n="mb.status_verifying">Đang xác minh</option>
        <option value="verify_failed" data-i18n="mb.status_verify_failed">Xác minh thất bại</option>
        <option value="verified" data-i18n="mb.status_verified">Đã xác minh</option>
      </select>
      <label data-i18n="mb.note">Ghi chú</label><textarea id="mb-note" class="px-input" rows="3"></textarea>
      <div class="modal-actions">
        <button class="px-btn" onclick="closeModal('mb-modal')" data-i18n="common.cancel">Hủy</button>
        <button class="px-btn primary" onclick="saveMailbox()" data-i18n="mb.save">Lưu</button>
      </div>
    </div>
  </div>

  <!-- 批量导入 modal -->
  <div class="modal-mask" id="import-modal" style="display:none">
    <div class="modal px-panel" style="width:620px">
      <h2 data-i18n="mb.import_title">Nhập hòm thư hàng loạt</h2>
      <div class="import-sub" data-i18n="mb.import_sub">Mỗi dòng một hòm thư, tự động bỏ qua email trùng lặp, định dạng:</div>
      <div class="import-formats">
        <code>mail|password|refresh_token|client_id</code>
      </div>
      <textarea id="import-text" class="px-input import-textarea" rows="11" placeholder="Dán nội dung vào đây, hoặc kéo thả tệp .txt vào đây ..."
        data-i18n-ph="mb.import_placeholder"></textarea>
      <div class="modal-actions">
        <span id="import-count" class="import-count">Đã nhận diện 0 hòm thư</span>
        <button class="px-btn" onclick="closeModal('import-modal')" data-i18n="common.cancel">Hủy</button>
        <button class="px-btn primary" onclick="doImport()" data-i18n="mb.do_import">Nhập tệp</button>
      </div>
    </div>
  </div>

  <!-- 取件 modal -->
  <div class="modal-mask" id="mail-modal" style="display:none">
    <div class="modal px-panel mail-modal">
      <div class="mail-head">
        <div>
          <h2 id="mail-title" data-i18n="mb.fetch_title">Lấy thư</h2>
          <div class="mail-sub" id="mail-sub"></div>
        </div>
        <button class="px-btn" onclick="closeMailModal()" data-i18n="acc.close">Đóng</button>
      </div>
      <div class="mail-body">
        <div class="mail-list" id="mail-list">
          <div class="mail-empty" data-i18n="mb.loading">Đang tải...</div>
        </div>
        <div class="mail-detail">
          <div class="mail-meta" id="mail-meta"></div>
          <iframe id="mail-frame" sandbox="allow-same-origin allow-popups" title="Nội dung email"></iframe>
        </div>
      </div>
    </div>
  </div>

  <div id="toast" class="toast" style="display:none"></div>
  <script src="/static/i18n/zh.js"></script>
  <script src="/static/i18n/en.js"></script>
  <script src="/static/i18n/vi.js"></script>
  <script src="/static/i18n/i18n.js"></script>
  <script src="/static/layout.js?v=2"></script>
  <script src="/static/mailboxes.js?v=8"></script>
</body>

</html>
